
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login SITTA - Universitas Terbuka</title>
<style>
*{box-sizing:border-box;font-family:Arial,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0b3b75,#147d92)}
.card{display:grid;grid-template-columns:1fr 1fr;width:100%;max-width:850px;background:white;border-radius:18px;overflow:hidden;box-shadow:0 15px 40px #0003}
.info{padding:40px;background:#0b3b75;color:white;display:flex;flex-direction:column;justify-content:center}
.info h1{font-size:38px;margin:0 0 15px}
.form-area{padding:40px}
h2{color:#17365d;margin-top:0}
label{display:block;font-size:14px;font-weight:bold;margin:18px 0 8px}
input{width:100%;padding:13px;border:1px solid #ccd2dc;border-radius:8px;font-size:15px}
button{cursor:pointer}
.login{width:100%;padding:14px;margin-top:22px;border:0;border-radius:8px;background:#0b5cab;color:white;font-weight:bold;font-size:15px}
.links{display:flex;justify-content:space-between;margin-top:20px}
.links button{border:0;background:none;color:#0b5cab}
.footer{margin-top:30px;border-top:1px solid #ddd;padding-top:16px;text-align:center;color:#667085;font-size:12px}
#status{font-size:13px;line-height:1.5;margin-top:12px;color:#a33}
@media(max-width:650px){.card{grid-template-columns:1fr}.info,.form-area{padding:25px}}
</style>
</head>
<body>
<div class="card">
  <section class="info">
    <h1>SITTA</h1>
    <p><strong>Sistem Informasi Tata Bahan Ajar</strong></p>
    <p>Universitas Terbuka</p>
    <p>Pengelolaan bahan ajar, pemesanan, dan pelacakan pengiriman.</p>
  </section>
  <section class="form-area">
    <h2>Selamat Datang!</h2>
    <p>Masuk menggunakan akun yang tersedia pada data aplikasi.</p>
    <form id="formLogin">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="login" id="tombolLogin" type="submit" disabled>Memuat data pengguna...</button>
      <p id="status" role="status"></p>
    </form>
    <div class="links">
      <button type="button" id="lupa">Lupa Password?</button>
      <button type="button" id="daftar">Daftar Akun</button>
    </div>
    <div class="footer">SITTA · Universitas Terbuka<br>Aplikasi dibuat oleh <strong>Sumardi Hutabarat</strong></div>
  </section>
</div>

<script>
(function(){
  const tombol = document.getElementById("tombolLogin");
  const status = document.getElementById("status");
  const form = document.getElementById("formLogin");

  // Muat data.js terlebih dahulu. Login baru diaktifkan setelah data ditemukan.
  const sumber = document.createElement("script");
  sumber.src = new URL("data.js", window.location.href).href;

  sumber.onload = function(){
    if (Array.isArray(window.dataPengguna)) {
      tombol.disabled = false;
      tombol.textContent = "Login";
      status.textContent = "Data pengguna berhasil dimuat.";
      status.style.color = "green";
    } else {
      status.textContent = "File data.js terbuka, tetapi variabel dataPengguna tidak ditemukan.";
      tombol.textContent = "Data tidak tersedia";
    }
  };

  sumber.onerror = function(){
    status.textContent = "Gagal memuat data.js. Periksa apakah file data.js sudah dipublikasikan di GitHub/Vercel.";
    tombol.textContent = "Data tidak tersedia";
  };

  document.head.appendChild(sumber);

  form.addEventListener("submit", function(e){
    e.preventDefault();

    if (!Array.isArray(window.dataPengguna)) {
      status.textContent = "Data pengguna belum berhasil dimuat.";
      return;
    }

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    const akun = window.dataPengguna.find(function(u){
      return String(u.email || "").trim().toLowerCase() === email &&
             String(u.password || "") === password;
    });

    if (!akun) {
      status.textContent = "Email/password yang Anda masukkan salah.";
      return;
    }

    sessionStorage.setItem("sittaPenggunaAktif", JSON.stringify({
      id: akun.id,
      nama: akun.nama,
      email: akun.email,
      role: akun.role,
      lokasi: akun.lokasi
    }));

    window.location.replace("./index.html");
  });

  document.getElementById("lupa").addEventListener("click", function(){
    alert("Fitur pemulihan password belum tersedia.");
  });

  document.getElementById("daftar").addEventListener("click", function(){
    alert("Pendaftaran akun belum tersedia pada versi ini.");
  });
})();
</script>
</body>
</html>
