<body>

    <main class="login-container">

        <div class="logo">UT</div>

        <h1>SITTA</h1>

        <p class="subtitle">
            Sistem Informasi Tiras dan Transaksi Bahan Ajar
            <br>
            Universitas Terbuka
        </p>

        <div
            id="pesan"
            class="message"
            role="alert"
            aria-live="polite"
        ></div>

        <form id="formLogin">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    autocomplete="username"

            </div>

            <div class="form-group">
                <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                    >
                        Lihat
                    </button>
                </div>
            </div>

                type="submit"
                id="tombolLogin"
                class="login-button"
            >
                Masuk
            </button>

        </form>

        <div class="footer">
            SITTA — Universitas Terbuka
            <br>
            Sistem Informasi Bahan Ajar
        </div>

    </main>

    <!-- Muat data sebelum menjalankan proses login -->
    <script src="./data.js"></script>

    <script>
        (function () {
            "use strict";

            const formLogin = document.getElementById("formLogin");
            const inputEmail = document.getElementById("email");
            const inputPassword = document.getElementById("password");
            const tombolLogin = document.getElementById("tombolLogin");
            const pesan = document.getElementById("pesan");
            const togglePassword = document.getElementById("togglePassword");

            function tampilkanPesan(teks, jenis) {
                pesan.textContent = teks;
                pesan.className = "message " + jenis;
            }

            /*
             * Memastikan data pengguna tersedia.
             * Mendukung deklarasi var dataPengguna maupun
             * window.dataPengguna pada data.js.
             */
            function ambilDataPengguna() {
                if (
                    typeof window.dataPengguna !== "undefined" &&
                    Array.isArray(window.dataPengguna)
                ) {
                    return window.dataPengguna;
                }

                if (
                    typeof dataPengguna !== "undefined" &&
                    Array.isArray(dataPengguna)
                ) {
                    return dataPengguna;
                }

                return null;
            }

            function periksaData() {
                const pengguna = ambilDataPengguna();

                if (!pengguna || pengguna.length === 0) {
                    tombolLogin.disabled = true;

                    tampilkanPesan(
                        "Layanan login belum tersedia. Silakan coba kembali nanti.",
                        "error"
                    );

                    console.error(
                        "Data pengguna tidak tersedia. Periksa data.js dan lokasi file."
                    );

                    return false;
                }

                tombolLogin.disabled = false;
                pesan.className = "message";

                return true;
            }

            togglePassword.addEventListener("click", function () {
                const sembunyi = inputPassword.type === "password";

                inputPassword.type = sembunyi
                    ? "text"
                    : "password";

                togglePassword.textContent = sembunyi
                    ? "Sembunyikan"
                    : "Lihat";
            });

            formLogin.addEventListener("submit", function (event) {
                event.preventDefault();

                const daftarPengguna = ambilDataPengguna();

                if (!daftarPengguna || daftarPengguna.length === 0) {
                    periksaData();
                    return;
                }

                const email = inputEmail.value.trim().toLowerCase();
                const password = inputPassword.value;

                const pengguna = daftarPengguna.find(function (user) {
                    return (
                        String(user.email || "").trim().toLowerCase() === email &&
                        String(user.password || "") === password
                    );
                });

                if (!pengguna) {
                    tampilkanPesan(
                        "Email atau password tidak sesuai.",
                        "error"
                    );
                    return;
                }

                const sesiPengguna = {
                    id: pengguna.id,
                    nama: pengguna.nama,
                    email: pengguna.email,
                    role: pengguna.role,
                    lokasi: pengguna.lokasi
                };

                try {
                    sessionStorage.setItem(
                        "sittaPenggunaAktif",
                        JSON.stringify(sesiPengguna)
                    );
                } catch (error) {
                    tampilkanPesan(
                        "Tidak dapat memulai sesi login. Silakan coba kembali.",
                        "error"
                    );

                    console.error("Gagal menyimpan sesi:", error);
                    return;
                }

                tampilkanPesan(
                    "Login berhasil. Membuka dashboard...",
                    "success"
                );

                window.location.href = "./dashboard.html";
            });

            periksaData();
        })();
    </script>

</body>
</html>
