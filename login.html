
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#123b70">

    <title>Login SITTA | Universitas Terbuka</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: linear-gradient(135deg, #123b70, #1976a8);
        }

        .login-container {
            width: 100%;
            max-width: 410px;
            background: #fff;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.2);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #e8f2ff;
            color: #123b70;
            font-size: 27px;
            font-weight: bold;
        }

        h1 {
            color: #123b70;
            text-align: center;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 19px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccd4df;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus {
            border-color: #1976a8;
            box-shadow: 0 0 0 3px rgba(25, 118, 168, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 90px;
        }

        .toggle-password {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #1976a8;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #123b70;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-button:hover {
            background: #1976a8;
        }

        .login-button:disabled {
            background: #8996a8;
            cursor: not-allowed;
        }

        .message {
            display: none;
            padding: 12px;
            margin-bottom: 18px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            color: #842029;
            background: #f8d7da;
        }

        .message.success {
            display: block;
            color: #0f5132;
            background: #d1e7dd;
        }

        .message.info {
            display: block;
            color: #084298;
            background: #cfe2ff;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #777;
            font-size: 12px;
            line-height: 1.8;
        }

        .footer strong {
            color: #123b70;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 26px 21px;
            }
        }
    </style>
</head>

<body>
    <main class="login-container">
        <div class="logo">UT</div>

        <h1>SITTA</h1>

        <p class="subtitle">
            Sistem Informasi Tiras dan Transaksi Bahan Ajar
            <br>
            Universitas Terbuka
        </p>

        <div
            id="pesan"
            class="message"
            role="status"
            aria-live="polite"
        ></div>

        <form id="formLogin">
            <div class="form-group">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Masukkan email"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <div class="password-wrapper">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Masukkan password"
                        autocomplete="current-password"
                        required
                    >

                    <button
                        type="button"
                        id="togglePassword"
                        class="toggle-password"
                        aria-label="Tampilkan password"
                    >
                        Lihat
                    </button>
                </div>
            </div>

            <button
                type="submit"
                id="tombolLogin"
                class="login-button"
            >
                Masuk
            </button>
        </form>

        <div class="footer">
            SITTA — Universitas Terbuka
            <br>
            Sistem Informasi Bahan Ajar
            <br>
            <strong>Aplikasi by Sumardi Hutabarat</strong>
        </div>
    </main>

    <!--
        Pastikan data.js berada satu folder dengan login.html.
        data.js harus berisi JavaScript saja, tanpa tag script HTML.
    -->
    <script src="./data.js" onerror="window.dataJsGagal = true;"></script>

    <script>
        (function () {
            "use strict";

            const formLogin = document.getElementById("formLogin");
            const inputEmail = document.getElementById("email");
            const inputPassword = document.getElementById("password");
            const tombolLogin = document.getElementById("tombolLogin");
            const pesan = document.getElementById("pesan");
            const togglePassword = document.getElementById("togglePassword");

            function tampilkanPesan(teks, jenis) {
                pesan.textContent = teks;
                pesan.className = "message " + jenis;
            }

            function ambilDataPengguna() {
                if (Array.isArray(window.dataPengguna)) {
                    return window.dataPengguna;
                }

                return null;
            }

            function periksaData() {
    const daftarPengguna = window.dataPengguna;

    if (window.dataJsGagal) {
        tombolLogin.disabled = true;

        tampilkanPesan(
            "File data.js gagal dimuat. Periksa lokasi file dan deployment Vercel.",
            "error"
        );

        console.error("SITTA: file data.js gagal dimuat.");
        return false;
    }

    if (!Array.isArray(daftarPengguna)) {
        tombolLogin.disabled = true;

        tampilkanPesan(
            "File data.js terbuka, tetapi dataPengguna tidak ditemukan. " +
            "Pastikan isi file data.js benar dan tidak ada error JavaScript.",
            "error"
        );

        console.error(
            "SITTA: window.dataPengguna tidak tersedia.",
            window.dataPengguna
        );

        return false;
    }

    if (daftarPengguna.length === 0) {
        tombolLogin.disabled = true;

        tampilkanPesan(
            "Data pengguna kosong. Periksa isi file data.js.",
            "error"
        );

        return false;
    }

    tombolLogin.disabled = false;
    pesan.className = "message";

    console.log(
        "SITTA: data.js berhasil dimuat. Jumlah pengguna:",
        daftarPengguna.length
    );

    return true;
}
            togglePassword.addEventListener("click", function () {
                const akanDitampilkan = inputPassword.type === "password";

                inputPassword.type = akanDitampilkan ? "text" : "password";
                togglePassword.textContent = akanDitampilkan
                    ? "Sembunyikan"
                    : "Lihat";

                togglePassword.setAttribute(
                    "aria-label",
                    akanDitampilkan
                        ? "Sembunyikan password"
                        : "Tampilkan password"
                );
            });

            formLogin.addEventListener("submit", function (event) {
                event.preventDefault();

                if (!periksaData()) {
                    return;
                }

                const email = inputEmail.value.trim().toLowerCase();
                const password = inputPassword.value;

                const daftarPengguna = ambilDataPengguna();

                const pengguna = daftarPengguna.find(function (user) {
                    return (
                        String(user.email || "").trim().toLowerCase() === email &&
                        String(user.password || "") === password
                    );
                });

                if (!pengguna) {
                    tampilkanPesan(
                        "Email atau password tidak sesuai. Silakan periksa kembali.",
                        "error"
                    );

                    inputPassword.focus();
                    return;
                }

                // Jangan menyimpan password dalam data sesi.
                const sesiPengguna = {
                    id: pengguna.id,
                    nama: pengguna.nama,
                    email: pengguna.email,
                    role: pengguna.role,
                    lokasi: pengguna.lokasi
                };

                try {
                    sessionStorage.setItem(
                        "sittaPenggunaAktif",
                        JSON.stringify(sesiPengguna)
                    );
                } catch (error) {
                    console.error("SITTA: gagal menyimpan sesi.", error);

                    tampilkanPesan(
                        "Sesi login tidak dapat disimpan. Periksa pengaturan browser.",
                        "error"
                    );

                    return;
                }

                tampilkanPesan(
                    "Login berhasil. Membuka dashboard...",
                    "success"
                );

                tombolLogin.disabled = true;

                window.location.href = "./dashboard.html";
            });

            // Periksa apakah data sudah tersedia saat halaman dibuka.
            periksaData();
        })();
    </script>
</body>
</html>
